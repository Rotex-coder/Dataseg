<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" fill="none">
  <!-- 
    Sade WA Premium Notification Badge SVG
    Designed with precise transparent gaps so that Android's monochrome status bar mask 
    perfectly displays a detailed paper airplane shape instead of a solid square.
  -->
  <!-- Left Wing (Beautiful WhatsApp Green #22c55e) -->
  <path d="M20.8 2.2L2.2 12.3L9.1 13.1L20.8 2.2Z" fill="#22c55e" />
  
  <!-- Right Wing (Vibrant Light Green #4ade80) -->
  <path d="M21.8 3.2L13.5 21.8L10.7 14.1L21.8 3.2Z" fill="#4ade80" />
  
  <!-- Central Tail Fold (Deep Green #15803d) -->
  <path d="M10.8 14.8L12.5 18.5L13.3 14.8L10.8 14.8Z" fill="#15803d" />
</svg>
